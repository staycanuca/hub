name: Verify IPTV Servers

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '_tools/verify_servers.py'

permissions:
  contents: write

concurrency:
  group: verify-servers-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run server verification
        env:
            SERVERS_URL: https://raw.githubusercontent.com/staycanuca/hub/refs/heads/main/_tools/servers.json
            OUTPUT_FILE: servers.json
            MAX_WORKERS: "8"
            CONNECT_TIMEOUT: "3"
            READ_TIMEOUT: "7"
            KEEP_UNREACHABLE: "true"
            VERIFY_TLS: "false"
            PYTHONUNBUFFERED: "1"
        run: python -u _tools/verify_servers.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --name-only | grep -q "^servers.json$"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add servers.json
          git commit -m "Update servers.json - verified IPTV servers"
          git pull --rebase origin main
          git push origin main
